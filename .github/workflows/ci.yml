name: CI

# Test suite cần Postgres+pgvector THẬT (cosine_distance(), full-text search)
# và một dịch vụ S3-compatible THẬT (xem app/storage.py) — không mock được vì
# cả hai là hành vi CỦA hạ tầng, không phải logic thuần của app (xem
# tests/pg_test_helpers.py, tests/test_storage.py). CI vì vậy dựng một
# Postgres service (pgvector/pgvector:pg16) và một container MinIO tạm thời
# (S3-compatible, chạy local trong job — không cần tài khoản Backblaze B2
# thật để chạy CI) thay vì mock chúng đi.
#
# KHÔNG cần OPENAI_API_KEY/COHERE_API_KEY thật: mọi test dùng fake LLM/embed
# client (xem README, mục "Chạy test") — chỉ 2 hạ tầng trên là thật.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edututor_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enable pgvector extension
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d edututor_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Start MinIO (S3-compatible, thay Backblaze B2 khi chạy CI)
        run: |
          docker run -d --name minio -p 9010:9000 \
            -e MINIO_ROOT_USER=testkey -e MINIO_ROOT_PASSWORD=testsecret \
            minio/minio server /data
          until curl -sf http://localhost:9010/minio/health/live; do sleep 1; done

      - name: Create test bucket
        run: |
          pip install boto3
          python -c "
          import boto3
          c = boto3.client('s3', endpoint_url='http://localhost:9010', aws_access_key_id='testkey', aws_secret_access_key='testsecret', region_name='auto')
          c.create_bucket(Bucket='edututor-uploads')
          "

      - name: Run Alembic migration (xác nhận migration tự chạy được trên DB rỗng)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/edututor_test
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/edututor_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/edututor_test
          STORAGE_ENDPOINT_URL: http://localhost:9010
          STORAGE_ACCESS_KEY_ID: testkey
          STORAGE_SECRET_ACCESS_KEY: testsecret
          STORAGE_BUCKET_NAME: edututor-uploads
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
