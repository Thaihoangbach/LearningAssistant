services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

# Không còn volume nào — DB (Postgres), vector (pgvector, cùng DB) và file
# gốc (Backblaze B2) đều là dịch vụ NGOÀI container, cấu hình qua .env
# (DATABASE_URL/STORAGE_*). Dựng Postgres+pgvector cục bộ để phát triển:
#   docker run -d -p 5432:5432 -e POSTGRES_PASSWORD=postgres pgvector/pgvector:pg16
